name: Panel and Multi-Protocol Tunnel Checks
on:
  push:
    branches: [blue-knight-net, main]
  pull_request:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - contract
          - warp
          - awg
          - api
          - edge-cases
          - easter-egg
          - local
          - static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.suite == 'static'
        with:
          node-version: '20'
      - name: Run contract tests
        if: matrix.suite == 'contract'
        run: python3 -m unittest -v test_core_contract.py
      - name: Run warp tests
        if: matrix.suite == 'warp'
        run: python3 -m unittest -v test_warp.py
      - name: Run awg tests
        if: matrix.suite == 'awg'
        run: python3 -m unittest -v test_awg.py
      - name: Run api tests
        if: matrix.suite == 'api'
        run: python3 -m unittest -v test_panel_api.py
      - name: Run edge case and revocation tests
        if: matrix.suite == 'edge-cases'
        run: python3 -m unittest -v test_peer_revocation_and_edge_cases.py
      - name: Run easter egg tests
        if: matrix.suite == 'easter-egg'
        run: python3 -m unittest -v test_easter_egg.py
      - name: Run local app tests
        if: matrix.suite == 'local'
        run: python3 -m unittest -v test_local_app.py
      - name: Run static checks
        if: matrix.suite == 'static'
        run: |
          node -c web/panel.js
          python3 build_panel.py && git diff --exit-code panel.html
          bash -n install.sh update.sh awg-install.sh test_awg_linux.sh test_e2e_real_tunnel.sh docker-entrypoint.sh
  real-tunnel-e2e:
    name: Real Tunnel E2E (${{ matrix.arch }})
    needs: [panel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libmnl-dev iproute2 iputils-ping curl wireguard-tools iptables
      - name: Attempt native AmneziaWG kernel module setup (testing kernel priority & fallback)
        continue-on-error: true
        run: |
          sudo add-apt-repository -y ppa:amnezia/ppa || true
          sudo apt-get update -qq || true
          sudo apt-get install -y amneziawg amneziawg-dkms "linux-headers-$(uname -r)" || true
          sudo modprobe amneziawg || true
      - name: Build pinned official AmneziaWG sources
        run: |
          mkdir -p /tmp/diana-awg/{go,tools,bin}
          curl -fsSL https://codeload.github.com/amnezia-vpn/amneziawg-go/tar.gz/b5928efb6ca19f0153958460c3d141f04abc5c2e | tar -xz --strip-components=1 -C /tmp/diana-awg/go
          curl -fsSL https://codeload.github.com/amnezia-vpn/amneziawg-tools/tar.gz/ee0f0a9aa34ff0a0da4b3433b9512781cfe02843 | tar -xz --strip-components=1 -C /tmp/diana-awg/tools
          (cd /tmp/diana-awg/go && go build -trimpath -o /tmp/diana-awg/bin/amneziawg-go .)
          make -C /tmp/diana-awg/tools/src -j2
          cp /tmp/diana-awg/tools/src/wg /tmp/diana-awg/bin/awg
      - name: Test real WireGuard, AmneziaWG and WARP routing across namespaces
        run: sudo bash test_e2e_real_tunnel.sh /tmp/diana-awg/bin
